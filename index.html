<!DOCTYPE html>

<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.b{pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;width:clamp(54px,15vmin,80px);height:clamp(54px,15vmin,80px);border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);font-size:11px;text-align:center;line-height:1.1}
.b.on{background:rgba(255,190,40,.55)}.b.t{height:clamp(90px,26vmin,130px);border-radius:24px}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,10,25,.72);backdrop-filter:blur(5px);padding:12px;overflow:auto}

.btn{background:#ffb703;color:#111;border:0;border-radius:12px;padding:12px 26px;font:800 17px system-ui;margin:4px;cursor:pointer}
.st{font-size:38px;color:#ffcf40}
</style></head><body>
<canvas id="c"></canvas>
<div id="hud">
 <div id="top">
  <div class="p"><small>Earned</small><span id="mo">$0</span></div>
  <div class="p"><small>Passengers</small><span id="px">0/40</span></div>
  <div class="p"><small>Health</small><div id="hb"><b></b></div></div>
  <div class="p" id="rt"><small id="nx">Route</small><div id="rl"><span id="bus">🚌</span></div></div>
  <div class="p" id="bt"><span data-a="pause">⏸</span><span data-a="night">🌙</span><span data-a="mute">🔊</span></div>
 </div>
 <div id="bp" class="p"><span id="bl"></span><div><i id="bf"></i></div></div>
 <div id="msg"></div>
 <div id="spd" class="p"><span id="sl">◀</span> <span id="sv">0</span> <small style="display:inline">km/h</small> <span id="sr">▶</span><small id="ds">Doors closed</small></div>
</div>
<div id="ctl">
 <div style="left:10px"><span class="b" data-k="l">◀</span><span class="b" data-k="r">▶</span></div>
 <div style="right:10px;flex-direction:column;align-items:flex-end">
  <div style="display:flex;gap:8px"><span class="b" data-a="door">DOORS</span><span class="b" data-k="horn">HORN</span><span class="b" data-k="hb">HAND<br>BRAKE</span></div>
  <div style="display:flex;gap:10px"><span class="b t" data-k="d">BRAKE</span><span class="b t" data-k="u">GAS</span></div>
 </div>
</div>
<div id="ov"></div>
<script>
'use strict';
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d');
let W,H,DPR;
function rs(){DPR=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*DPR|0;H=cv.height=innerHeight*DPR|0}
addEventListener('resize',rs);rs();
const SL=200,RW=2000,CH=1600,CD=.84,PZ=CH*CD,DD=120,LEN=5200,N=LEN+DD+30,ZL=10,VM=95,KS=64,CAP=40;
const STOPS=[450,1250,2100,3000,3900,4750];
const R=Math.random,cl=(v,a,b)=>v<a?a:v>b?b:v,lp=(a,b,t)=>a+(b-a)*t;
// ---------- track ----------
const F=[];for(let i=0;i<=N+1;i++){let m=1e9;for(const s of STOPS)m=Math.min(m,Math.abs(i-s-5));F[i]=cl((m-14)/18,0,1)}
const hy=i=>F[i]*(Math.sin(i/80)*1400+Math.sin(i/27)*300);
const S=[];for(let i=0;i<N;i++)S.push({i,y1:hy(i),y2:hy(i+1),c:F[i]*(Math.sin(i/95)*2.3+Math.sin(i/31+1)*.8),sp:[],z:-1});
STOPS.forEach((s,k)=>{for(let j=0;j<ZL;j++)S[s+j].z=k;S[s].zl=S[s+ZL-1].zl=1;S[s-26].sp.push({x:1.25,t:'sign'});S[s+1].sp.push({x:1.25,t:'sign'});S[s+5].sp.push({x:1.65,t:'shel',k})});
S[LEN-2].sp.push({x:0,t:'fin'});
for(let i=0;i<N;i++){const u=(i/700|0)%2==0&&i>60;
 if(i%(u?5:7)==0)[-1,1].forEach(d=>{if(R()<.9){if(u&&R()<.8)S[i].sp.push({x:d*(2.4+R()*1.4),t:'bld',h:3+R()*5,w:1.4+R()*1.2,c:R()*360|0,s:R()*99|0});else S[i].sp.push({x:d*(1.8+R()*3),t:'tree',h:1.2+R()*.8,v:R()<.5})}});
 if(i%14==0)S[i].sp.push({x:-1.25,t:'lamp'},{x:1.25,t:'lamp'})}
const GL=document.createElement('canvas');GL.width=GL.height=64;{const c=GL.getContext('2d'),r=c.createRadialGradient(32,32,0,32,32,32);r.addColorStop(0,'rgba(255,240,190,1)');r.addColorStop(.3,'rgba(255,220,140,.35)');r.addColorStop(1,'rgba(255,200,100,0)');c.fillStyle=r;c.fillRect(0,0,64,64)}
// ---------- palette ----------
const DAY=[[90,160,235],[205,230,250],[76,152,64],[68,140,58],[106,108,114],[98,100,106],[200,40,40],[236,236,236],[236,236,236],[34,120,50],[48,140,60],[90,60,35]],
NIT=[[4,6,26],[30,38,80],[14,34,24],[12,29,21],[38,40,48],[33,35,43],[100,22,28],[120,120,128],[150,150,160],[8,26,18],[10,30,20],[25,18,12]];
const mx=(a,b,t)=>`rgb(${lp(a[0],b[0],t)|0},${lp(a[1],b[1],t)|0},${lp(a[2],b[2],t)|0})`;
let PL,night=0,nt=0;
const pal=()=>{PL=DAY.map((d,i)=>mx(d,NIT[i],night))};
const STAR=Array.from({length:70},()=>[R(),R()]);
// ---------- state ----------
const K={l:0,r:0,u:0,d:0,hb:0,horn:0,d2:0};
let M='menu',pos=0,px=.66,v=0,ang=0,door=0,boarding=0,health=100,money=0,onboard=0,t=0,bgx=0,hitCd=0,shake=0,rt=0,muted=0,sig=0,blk=0,hz=0,brakeOn=0,bpT='',bpP=-1,ST=[],stats={},cars=[],dots=[];
const LN=[-.66,0,.66],CC=['#c33','#36c','#eee','#333','#fa0','#2a7','#a3c','#888'];
function reset(){pos=0;px=.66;v=0;ang=0;door=0;health=100;money=0;onboard=0;rt=0;hitCd=0;stats={pax:0};
 ST=STOPS.map(()=>{const w=3+R()*9|0;return{w,left:w,done:0,miss:0,t:0,n:0,tot:-1}});
 cars=[];for(let i=0;i<34;i++){const l=R()*3|0;cars.push({z:6000+R()*(LEN*SL-9000),l,x:LN[l],tx:LN[l],v0:30+R()*34,v:40,t:R()<.18?2:R()<.3?1:0,c:CC[R()*8|0],br:0})}
 $('rl').querySelectorAll('i').forEach(e=>e.remove());dots=STOPS.map(s=>{const i=document.createElement('i');i.style.left=s/LEN*100+'%';$('rl').appendChild(i);return i})}
// ---------- audio ----------
let AC,MG,eng,ef,eg,sg,nb,hn;
function ainit(){if(AC){if(AC.state=='suspended')AC.resume();return}
 try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 MG=AC.createGain();MG.connect(AC.destination);
 const o1=AC.createOscillator(),o2=AC.createOscillator();o1.type='sawtooth';o2.type='square';
 ef=AC.createBiquadFilter();ef.type='lowpass';eg=AC.createGain();eg.gain.value=0;o1.connect(ef);o2.connect(ef);ef.connect(eg);eg.connect(MG);o1.start();o2.start();eng=[o1,o2];
 const b=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1;nb=b;
 const n=AC.createBufferSource();n.buffer=b;n.loop=true;const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=2400;f.Q.value=6;sg=AC.createGain();sg.gain.value=0;n.connect(f);f.connect(sg);sg.connect(MG);n.start()}
function tone(f,d,ty,vol,dl=0){if(!AC)return;const o=AC.createOscillator(),gn=AC.createGain(),s=AC.currentTime+dl;o.type=ty;o.frequency.value=f;gn.gain.setValueAtTime(0,s);gn.gain.linearRampToValueAtTime(vol,s+.02);gn.gain.exponentialRampToValueAtTime(.001,s+d);o.connect(gn);gn.connect(MG);o.start(s);o.stop(s+d+.05)}
function noise(d,f,ty,vol){if(!AC)return;const n=AC.createBufferSource(),fl=AC.createBiquadFilter(),gn=AC.createGain(),s=AC.currentTime;n.buffer=nb;fl.type=ty;fl.frequency.value=f;gn.gain.setValueAtTime(vol,s);gn.gain.exponentialRampToValueAtTime(.001,s+d);n.connect(fl);fl.connect(gn);gn.connect(MG);n.start(s);n.stop(s+d)}
const chime=()=>{tone(880,.3,'sine',.14);tone(1175,.4,'sine',.12,.12)},hiss=()=>noise(.5,3500,'highpass',.2),crashS=()=>{noise(.5,500,'lowpass',.6);tone(70,.4,'sine',.5)};
function hornOn(){if(!AC||hn||M!='play')return;hn=[311,392].map(f=>{const o=AC.createOscillator(),gn=AC.createGain();o.type='sawtooth';o.frequency.value=f;gn.gain.value=.1;o.connect(gn);gn.connect(MG);o.start();return o})}
function hornOff(){if(hn){hn.forEach(o=>o.stop());hn=0}}
function audio(){if(!AC)return;const p=M=='play',n=AC.currentTime,gs=[0,16,32,50,70,200],gi=gs.findIndex((x,i)=>v<gs[i+1]),rpm=cl((v-gs[gi])/(gs[gi+1]-gs[gi]),0,1),th=(!door&&K.u)?1:0,f=34+rpm*52+gi*3+th*6;
 eng[0].frequency.setTargetAtTime(f,n,.06);eng[1].frequency.setTargetAtTime(f*.5,n,.06);ef.frequency.setTargetAtTime(220+rpm*350+th*500,n,.08);
 eg.gain.setTargetAtTime(p?.06+.07*th+.03*rpm:0,n,.1);sg.gain.setTargetAtTime(p&&v>25&&(K.d||K.hb)?.06*Math.min(1,v/60):0,n,.04)}
// ---------- helpers/UI ----------
let mt;function msg(s,ms=1800){const e=$('msg');e.textContent=s;e.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>e.style.opacity=0,ms)}
function ov(h){const o=$('ov');o.innerHTML=h;o.style.display=h?'flex':'none'}
const sv=(id,val)=>{const e=$(id);if(e._v!==val){e._v=val;e.textContent=val}};
function hud(){sv('sv',v|0);sv('mo','$'+(money|0));sv('px',onboard+'/'+CAP);const hb=$('hb').firstChild;hb.style.width=health+'%';hb.style.background=health>50?'#4d6':health>25?'#fc3':'#e44';
 $('bus').style.left=cl((pos+PZ)/(LEN*SL),0,1)*100+'%';dots.forEach((d,k)=>{d.className=ST[k].done?'d':ST[k].miss?'m':''});
 const k=ST.findIndex(s=>!s.done&&!s.miss);sv('nx',k<0?'Head to the finish!':`Stop ${k+1}/${STOPS.length} · ${Math.max(0,(STOPS[k]*SL-pos-PZ)/230|0)} m`);
 sv('ds',door?'DOORS OPEN':'Doors closed');$('ds').style.color=door?'#fb0':'';
 $('sl').className=(sig<0||hz)&&blk?'on':'';$('sr').className=(sig>0||hz)&&blk?'on':'';
 const bp=$('bp');bp.style.display=bpT?'block':'none';sv('bl',bpT);$('bf').parentNode.style.display=bpP<0?'none':'block';$('bf').style.width=Math.max(0,bpP)*100+'%'}
function go(){ainit();reset();M='play';ov('');$('hud').style.display='block'}
function resume(){M='play';ov('')}
function act(a){if(a=='night')nt^=1;else if(a=='mute'){muted^=1;if(MG)MG.gain.value=muted?0:1;$('bt').children[2].textContent=muted?'🔇':'🔊'}
 else if(a=='door'){if(M!='play')return;if(!door&&v>2)msg('Stop the bus first');else toggleDoor()}
 else if(a=='pause'){if(M=='play'){M='pause';hornOff();ov(`<div class="card"><h1>Paused</h1><button class="btn" onclick="resume()">Resume</button><button class="btn" onclick="go()">Restart</button></div>`)}else if(M=='pause')resume()}}
function toggleDoor(){if(door){door=0;hiss();msg('Doors closed')}else{door=1;hiss();if(!(S[(pos+PZ)/SL|0].z>=0))msg('Not at a bus stop!')}}
function hurt(a){health-=a;if(health<=0){health=0;finish(false)}}
function finish(w){if(M!='play')return;M='end';hornOff();const k=ST.filter(s=>s.done).length,m=ST.filter(s=>s.miss).length,stars=w?(k==STOPS.length&&health>50?3:k>=4?2:1):0,ss=rt|0;
 ov(`<div class="card"><h1>${w?'Route Complete!':'Bus Wrecked'}</h1><div class="st">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div><table><tr><td>Earned<td>$${money|0}<tr><td>Passengers carried<td>${stats.pax}<tr><td>Stops served<td>${k}/${STOPS.length} (${m} missed)<tr><td>Bus health<td>${health|0}%<tr><td>Time<td>${ss/60|0}:${String(ss%60).padStart(2,'0')}</table><button class="btn" onclick="go()">${w?'Drive again':'Try again'}</button></div>`)}
// ---------- input ----------
const KM={ArrowLeft:'l',a:'l',ArrowRight:'r',ArrowUp:'u',w:'u',ArrowDown:'d',s:'d',' ':'hb',h:'horn',d:'d2'};
const kk=e=>e.key.length>1?e.key:e.key.toLowerCase();
addEventListener('keydown',e=>{const k=kk(e);ainit();if(k=='Escape'||k=='p'){if(!e.repeat)act('pause');return}if(e.repeat&&!KM[k])return;
 if(k=='n'&&!e.repeat)act('night');if(k=='m'&&!e.repeat)act('mute');
 if(KM[k]){e.preventDefault();K[KM[k]]=1;if(k=='h')hornOn();if(k=='d'&&!e.repeat&&M=='play'&&(door||v<2))toggleDoor()}});
addEventListener('keyup',e=>{const k=kk(e);if(KM[k]){K[KM[k]]=0;if(k=='h')hornOff()}});
document.addEventListener('pointerdown',e=>{const t=e.target.closest('[data-k],[data-a]');if(!t)return;e.preventDefault();ainit();
 if(t.dataset.k){K[t.dataset.k]=1;t.classList.add('on');try{t.setPointerCapture(e.pointerId)}catch(_){}if(t.dataset.k=='horn')hornOn()}else act(t.dataset.a)},{passive:false});
const up=e=>{const t=e.target.closest&&e.target.closest('[data-k]');if(!t)return;K[t.dataset.k]=0;t.classList.remove('on');if(t.dataset.k=='horn')hornOff()};
['pointerup','pointercancel','lostpointercapture'].forEach(n=>document.addEventListener(n,up));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&M=='play')act('pause')});
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)$('ctl').style.display='block';
// ---------- update ----------
function upd(dt){
 const sp=v/VM,bz=pos+PZ,b=bz/SL|0,bs=S[b];
 const thr=(!door&&K.u)?1:0;brakeOn=!!(K.d||K.hb||(door&&v>0));
 v+=thr*14*(1-v/105)*dt;v-=((K.d?34:0)+(K.hb?48:0)+(door?38:0)+1.5+v*.015)*dt;v-=(bs.y2-bs.y1)/SL*dt*18;
 const off=Math.abs(px)>1.04;if(off&&v>45)v-=35*dt;v=cl(v,0,VM);
 const tg=(K.r||(K.d2&&v>=2&&!door)?1:0)-K.l;ang+=(tg-ang)*Math.min(1,dt*7);
 px+=ang*dt*2.7*Math.min(1,sp*1.6+(v>.5?.18:0));px-=dt*2*sp*sp*bs.c*.26;
 if(Math.abs(px)>1.3){px=cl(px,-1.3,1.3);v*=1-1.5*dt;hurt(dt*14*sp);shake=Math.max(shake,8)}else if(off)shake=Math.max(shake,v*.1);
 shake*=1-Math.min(1,dt*6);pos+=v*KS*dt;bgx+=bs.c*sp*dt*40;rt+=dt;hitCd-=dt;
 sig=ang<-.3?-1:ang>.3?1:0;blk=(t*3.2%1)<.5;hz=door;
 // traffic
 for(const c of cars){const zz=c.z/SL;c.tx=LN[c.l];if(c.l==2)for(const s of STOPS)if(zz>s-22&&zz<s+ZL+4)c.tx=0;
  c.x+=(c.tx-c.x)*Math.min(1,dt*1.2);let tv=c.v0;
  for(const o of cars)if(o!==c&&Math.abs(o.x-c.x)<.3&&o.z>c.z&&o.z-c.z<900)tv=Math.min(tv,o.v);
  if(Math.abs(px-c.x)<.3&&bz>c.z&&bz-c.z<900)tv=Math.min(tv,v);
  c.v+=(tv-c.v)*Math.min(1,dt*2);c.br=c.v<c.v0-3;c.z+=c.v*KS*dt;
  const dz=c.z-bz;if(dz>-120&&dz<280&&Math.abs(c.x-px)<.37&&hitCd<=0){hitCd=1;const d=cl((v-c.v)*.5+5,5,30);v*=.3;c.v=Math.max(c.v,15);c.x+=(c.x>=px?1:-1)*.25;money=Math.max(0,money-15);shake=18;crashS();msg('Collision! −$15',1200);hurt(d)}}
 // bus stops
 const zk=bs.z;bpT='';bpP=-1;boarding=0;
 if(zk>=0&&px>.38){const s=ST[zk];if(!s.done){
  if(!door)bpT=v>1.5?'Brake to a complete stop':'Press D / DOORS to open the doors';
  else if(v<1.5){boarding=1;if(s.tot<0){s.drop=zk==STOPS.length-1?onboard:Math.round(onboard*(.35+R()*.4));s.pick=Math.min(s.left,CAP-(onboard-s.drop));s.tot=s.drop+s.pick;s.n=0;s.t=0}
   s.t+=dt;while(s.n<s.tot&&s.t>(s.n+1)*.32){s.n++;if(s.n<=s.drop)onboard--;else{onboard++;s.left--;money+=6;stats.pax++}chime()}
   bpT=`Boarding ${s.n}/${s.tot}`;bpP=s.tot?s.n/s.tot:1;
   if(s.n>=s.tot){s.done=1;money+=25;boarding=0;bpT='';bpP=-1;msg('Stop complete! +$25 — close the doors, then drive on',2800)}}}
 }else if(zk>=0&&!ST[zk].done)bpT='Pull into the right lane';
 ST.forEach((s,k)=>{if(!s.done&&!s.miss&&b>STOPS[k]+ZL){s.miss=1;money=Math.max(0,money-30);msg('Missed stop '+(k+1)+'! −$30',2500)}});
 if(bz>=LEN*SL)finish(true)}
// ---------- drawing ----------
const pg=(x1,y1,x2,y2,x3,y3,x4,y4,c)=>{g.fillStyle=c;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.lineTo(x3,y3);g.lineTo(x4,y4);g.closePath();g.fill()};
const rr=(x,y,w,h,r,c)=>{g.fillStyle=c;g.beginPath();g.roundRect?g.roundRect(x,y,w,h,r):g.rect(x,y,w,h);g.fill()};
function seg(s){const{ax,ay,aw,bx,by,bw}=s,p=(s.i/3|0)&1,y=ay+1,r=aw/7,r2=bw/7;
 g.fillStyle=PL[2+p];g.fillRect(0,by,W,y-by);
